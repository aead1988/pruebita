name: Build custom fuel economy APK

on:
  push:
    branches:
      - master
      - agent/media-modes
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "19"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          touch local.properties
          ./gradlew assembleRelease

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/My-Huno-2.0.72-records-viewer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Huno-2.0.72-records-viewer
          path: app/build/outputs/apk/release/My-Huno-2.0.72-records-viewer.apk
          if-no-files-found: error
